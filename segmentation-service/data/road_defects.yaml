# Dataset definition for GramSetu road-defect semantic segmentation.
# Keep the directory structure described in the root README.
path: ../datasets/road-defects
train: images/train
val: images/val
test: images/test

# Must match the shipped model (models/model.onnx), whose metadata lists these three classes.
names:
  0: pothole
  1: crack
  2: openmanhole
