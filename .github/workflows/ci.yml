name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server (lint, unit + HTTP tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Cache MongoDB test binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-v1
      - run: npm ci
        working-directory: server
      - run: npm run lint
        working-directory: server
      # Real HTTP tests against an in-memory MongoDB replica set. AI, storage and
      # detection are faked: no secrets and no paid calls in CI.
      - run: npm test
        working-directory: server
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
        working-directory: server

  client:
    name: Client (lint, tests, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
        working-directory: client
      - run: npm run lint
        working-directory: client
      - run: npm test
        working-directory: client
      - run: npm run build
        working-directory: client
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
        working-directory: client

  detector:
    name: Detection service (lint, tests incl. real model)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: segmentation-service/requirements*.txt
      - name: Install (CPU-only PyTorch keeps this small)
        working-directory: segmentation-service
        run: |
          pip install --extra-index-url https://download.pytorch.org/whl/cpu torch torchvision
          pip install -r requirements.txt -r requirements-dev.txt ruff
      - run: ruff check .
        working-directory: segmentation-service
      - run: pytest -q -rs
        working-directory: segmentation-service
        env:
          YOLO_OFFLINE: '1'

  e2e:
    name: End-to-end (browser, real API, real model)
    runs-on: ubuntu-latest
    needs: [server, client, detector]
    services:
      mongo:
        image: mongo:7
        ports: ['27017:27017']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: segmentation-service/requirements*.txt
      - name: Start detection service
        working-directory: segmentation-service
        run: |
          pip install --extra-index-url https://download.pytorch.org/whl/cpu torch torchvision
          pip install -r requirements.txt
          SEGMENTATION_ENV=production YOLO_OFFLINE=1 nohup uvicorn app:app --host 127.0.0.1 --port 8011 > detector.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8011/health/ready && break; sleep 2; done
      - run: npm ci
        working-directory: server
      - run: npm ci && npx playwright install --with-deps chromium
        working-directory: client
      - run: npx playwright test
        working-directory: client
        env:
          E2E_MONGODB_URI: mongodb://127.0.0.1:27017/gramsetu_e2e
          E2E_SEGMENTATION_URL: http://127.0.0.1:8011
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: client/playwright-report
